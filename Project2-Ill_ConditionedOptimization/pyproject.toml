[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-rendezvous"
version = "0.1.0"
description = "Educational Clohessy-Wiltshire rendezvous optimization and conditioning diagnostics"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "clarabel>=0.10,<1",
  "cvxpy>=1.6,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "autograd>=1.7,<2",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
orbit-rendezvous = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "cli",
  "conditioning",
  "constraints",
  "diagnostics",
  "dynamics",
  "formulations",
  "models",
  "objectives",
  "solvers",
  "verification",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
